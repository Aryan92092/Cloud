# ============================================================
# Nginx configuration for the React frontend container.
# This file is copied into the Nginx image during Docker build.
# ============================================================

server {
    listen 80;
    server_name _;

    # Root directory where the built React files live
    root /usr/share/nginx/html;
    index index.html;

    # -- API proxy ----------------------------------------------
    # All requests to /api/* are forwarded to the backend container.
    # "backend" is the Docker service name defined in docker-compose.yml.
    # The browser only ever sees port 80; it never talks to port 5000 directly.
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts - increase if backend operations are slow
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
    }

    # -- React SPA routing --------------------------------------
    # When a user refreshes a page like /dashboard, Nginx must
    # serve index.html so React Router can handle the route.
    # Without this, refreshing any sub-page returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -- Static asset caching -----------------------------------
    # Tell browsers to cache JS/CSS/images aggressively.
    # Vite fingerprints filenames so cache-busting is automatic.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -- Security headers ---------------------------------------
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
}
